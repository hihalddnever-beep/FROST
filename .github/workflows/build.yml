name: Build FROST

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build mod
      - name: Build FROST
        run: |
          find project -name settings.gradle -exec dirname {} \; > project_dir.txt
          gradle --no-daemon -p "$(head -n 1 project_dir.txt)" clean build
        run: gradle --no-daemon clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FROST-Fabric-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          
